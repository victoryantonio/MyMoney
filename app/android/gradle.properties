org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
kotlin.daemon.jvmargs=-Xmx1536M
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Built-in Kotlin diaktifkan (AGP 9 + Flutter 3.47+). Plugin modern seperti
# file_picker 13 / package_info_plus 10 tidak lagi meng-apply Kotlin Gradle
# Plugin sendiri; mereka mengandalkan built-in Kotlin dari AGP.
# Tanpa ini, `flutter build apk` gagal dengan "cannot find symbol:
# class PackageInfoPlugin". Lihat: docs.flutter.dev/release/breaking-changes/
# flutter-android-built-in-kotlin
android.builtInKotlin=true
