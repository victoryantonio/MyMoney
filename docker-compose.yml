services:
  backend:
    build: ./backend
    mem_limit: 1.5g
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - mymoney_net

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # Named tunnel with a permanent custom domain (e.g. api.mymoneyofficial.online).
    # Requires CLOUDFLARE_TUNNEL_TOKEN from Cloudflare Zero Trust (Networks > Tunnels).
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - mymoney_net
    depends_on:
      - backend

networks:
  mymoney_net:
    driver: bridge
