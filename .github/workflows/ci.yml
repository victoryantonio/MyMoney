name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test (Backend)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mymoney_test
          POSTGRES_USER: mymoney_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Lint — ruff
        run: ruff check .
        working-directory: backend

      - name: Lint — black
        run: black --check .
        working-directory: backend

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://mymoney_user:test_password@localhost:5432/mymoney_test
          APP_ENV: testing
          APP_BASE_URL: http://localhost:8000
          # LLM gateway — required settings (no defaults in config.py).
          # The API keys default to "" in config.py, which makes llm_client
          # short-circuit; the tests need a non-empty placeholder key.
          OPENROUTER_API_KEY: sk-or-test-placeholder
          OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
          DEEPSEEK_API_KEY: sk-test-placeholder
          DEEPSEEK_BASE_URL: https://api.deepseek.com/v1
        run: pytest tests/ -v
        working-directory: backend

  app:
    name: Lint & Test (Flutter app)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: app

      - name: Analyze
        run: flutter analyze
        working-directory: app

      - name: Test
        run: flutter test
        working-directory: app

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t mymoney-backend:${{ github.sha }} .
        working-directory: backend
