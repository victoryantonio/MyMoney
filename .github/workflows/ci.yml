name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test (Backend)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mymoney_test
          POSTGRES_USER: mymoney_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt
        working-directory: backend

      - name: Lint — ruff
        run: ruff check .
        working-directory: backend

      - name: Lint — black
        run: black --check .
        working-directory: backend

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://mymoney_user:test_password@localhost:5432/mymoney_test
          JWT_SECRET_KEY: test_secret_key_for_ci_only_not_real
          OPENROUTER_API_KEY: sk-or-test-placeholder
          TELEGRAM_BOT_TOKEN: 123456789:test
          TELEGRAM_WEBHOOK_SECRET: test_secret
          APP_ENV: testing
          APP_BASE_URL: http://localhost:8000
        run: pytest tests/ -v
        working-directory: backend

  app:
    name: Lint & Test (Flutter app)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: app

      - name: Analyze
        run: flutter analyze
        working-directory: app

      - name: Test
        run: flutter test
        working-directory: app

  bot:
    name: Lint & Typecheck (Telegram bot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: bot/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: bot

      - name: Lint — eslint
        run: npm run lint
        working-directory: bot

      - name: Typecheck — tsc
        run: npm run typecheck
        working-directory: bot

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t mymoney-backend:${{ github.sha }} .
        working-directory: backend
